name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: API unit tests
        run: pnpm --filter @riding-app/api test
      - name: Web lint
        run: pnpm --filter @riding-app/web lint
      - name: Build API and Web
        run: |
          pnpm --filter @riding-app/api build
          pnpm --filter @riding-app/web build
